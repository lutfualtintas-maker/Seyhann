<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asistan</title>
<style>
:root{--bg:#eef1f6;--p:#fff;--t:#171b26;--m:#6a7286;--a:#2f4bd1;--ac:#fff;--b:#dde2ec;--u:#e3e9ff}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--p:#171b25;--t:#e7eaf2;--m:#8a93a8;--a:#8fb0ff;--ac:#0d1220;--b:#262c3a;--u:#1f2a4a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,Roboto,sans-serif}
#side{width:270px;background:var(--p);border-right:1px solid var(--b);display:flex;flex-direction:column;flex:none}
#side h1{font-size:18px;margin:16px 16px 8px;letter-spacing:.2px}
#side button.new{margin:4px 12px 8px;padding:12px;border:0;border-radius:10px;background:var(--a);color:var(--ac);font:600 15px inherit;font-family:inherit}
#list{flex:1;overflow:auto;padding:0 8px}
.ci{display:flex;justify-content:space-between;gap:8px;padding:11px 10px;border-radius:8px;cursor:pointer;font-size:15px}
.ci span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ci.on{background:var(--u)}
.ci i{font-style:normal;color:var(--m);padding:0 4px}
.nav{display:flex;border-top:1px solid var(--b)}
.nav button{flex:1;padding:14px 4px;border:0;background:none;color:var(--t);font:14px inherit;font-family:inherit}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:none;padding:10px 12px;border-bottom:1px solid var(--b);background:var(--p)}
#top button{border:0;background:none;color:var(--t);font-size:22px}
#msgs{flex:1;overflow:auto;padding:20px 5% 8px;scroll-behavior:smooth}
.m{max-width:820px;margin:0 auto 18px}
.m.user .b{background:var(--u);margin-left:auto;width:fit-content;max-width:88%;border-radius:16px 16px 4px 16px;padding:10px 14px}
.m.assistant .b{padding:2px 4px}
.b code{background:var(--b);padding:1px 5px;border-radius:5px;font-size:.92em}
.b pre{background:var(--b);padding:12px;border-radius:10px;overflow:auto;margin:8px 0}
.b pre code{padding:0;background:none}
.act{display:flex;gap:14px;align-items:center;color:var(--m);font-size:14px;margin:6px 4px 0}
.act span{cursor:pointer;padding:2px 4px;border-radius:6px}
.act span.on{background:var(--u);color:var(--t)}
.empty{max-width:560px;margin:18vh auto 0;text-align:center;color:var(--m)}
.empty b{display:block;font-size:22px;color:var(--t);margin-bottom:6px}
#bar{display:flex;gap:10px;padding:10px 5% 16px;max-width:calc(820px + 10%);width:100%;margin:0 auto}
#in{flex:1;resize:none;max-height:180px;padding:13px 14px;border-radius:14px;border:1px solid var(--b);background:var(--p);color:var(--t);font:16px/1.4 inherit;font-family:inherit;outline:none}
#in:focus,#go:focus-visible{border-color:var(--a);outline:2px solid var(--a);outline-offset:1px}
#go{width:52px;border:0;border-radius:14px;background:var(--a);color:var(--ac);font-size:20px}
.tg{width:46px;border:1px solid var(--b);border-radius:14px;background:var(--p);color:var(--t);font-size:18px;opacity:.55}.tg.on{opacity:1;background:var(--u);border-color:var(--a)}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:12px;z-index:9}
#box{background:var(--p);width:min(640px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:18px}
#box h2{margin:0 0 10px;font-size:19px}
#box label{display:block;margin:12px 0 4px;color:var(--m);font-size:14px}
#box input,#box select,#box textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--b);background:var(--bg);color:var(--t);font:15px inherit;font-family:inherit}
#box textarea{min-height:130px}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button,.btn{padding:9px 14px;border-radius:9px;border:1px solid var(--b);background:none;color:var(--t);font:14px inherit;font-family:inherit}
.tabs .on,.btn.pri{background:var(--a);color:var(--ac);border-color:var(--a)}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--b);font-size:15px}
.row i{font-style:normal;color:var(--m);cursor:pointer;padding:0 6px}
.hint{color:var(--m);font-size:13px;margin:6px 0}
@media(max-width:820px){#side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s}#side.open{transform:none;box-shadow:0 0 40px #0006}#top{display:block}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<aside id="side">
 <h1>Asistan</h1>
 <button class="new" onclick="newChat()">Yeni sohbet</button>
 <div id="list"></div>
 <div class="nav"><button onclick="panel('hafiza')">Hafıza</button><button onclick="panel('bilgi')">Bilgi tabanı</button><button onclick="panel('ayar')">Ayarlar</button></div>
</aside>
<main>
 <div id="top"><button onclick="side(1)" aria-label="Menü">☰</button></div>
 <div id="msgs"></div>
 <div id="bar"><textarea id="in" rows="1" placeholder="Bir şey sor ya da sohbet edelim…"></textarea><button class="tg" id="wbtn" onclick="tgl('web')" title="Web araması" aria-label="Web araması">🌐</button><button class="tg" id="sbtn" onclick="tgl('speak')" title="Sesli cevap" aria-label="Sesli cevap">🔊</button><button class="tg" id="mic" onclick="mic()" title="Konuş" aria-label="Konuş">🎤</button><button id="go" onclick="send()" aria-label="Gönder">➤</button></div>
</main>
<div id="modal" onclick="if(event.target===this)closeP()"><div id="box"></div></div>
<script>
const $=s=>document.querySelector(s);
const DEF='Sen Türkçe konuşan, sıcak ama net bir kişisel asistansın. Sohbet et; düşünerek ve doğru cevap ver. Öneri yaparken 2-3 seçeneği artı/eksileriyle sun, birini gerekçesiyle öner. Emin olmadığında bunu söyle, uydurma. Gereksiz uzatma; konu derinse detaylı ol. Kullanıcının hafızadaki bilgilerini ve kurallarını doğal şekilde kullan.';
let S;try{S=JSON.parse(localStorage.getItem('st')||'null')}catch(e){}
S=Object.assign({prov:'gemini',keys:{gemini:'',groq:''},pm:{gemini:'gemini-flash-latest',groq:'llama-3.3-70b-versatile'},web:true,speak:false,chats:[],cur:null,mem:[],rules:[],docs:[],sys:DEF},S||{});
let busy=0,ctl=null,tab='ayar',rec=null,noG=0,lastM='';
const save=()=>{try{localStorage.setItem('st',JSON.stringify(S))}catch(e){alert('Depolama dolu: eski sohbetleri veya dokümanları sil.')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const cur=()=>S.chats.find(c=>c.id===S.cur);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const md=s=>esc(s).replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const scroll=()=>{const m=$('#msgs');m.scrollTop=m.scrollHeight};
function side(o){$('#side').classList.toggle('open',!!o)}
function newChat(){S.cur=null;save();render();side(0);$('#in').focus()}
function del(id){S.chats=S.chats.filter(c=>c.id!==id);if(S.cur===id)S.cur=null;save();render()}

const hdr=P=>P==='gemini'?{'content-type':'application/json','x-goog-api-key':S.keys.gemini}:{'content-type':'application/json','authorization':'Bearer '+S.keys.groq};
async function sse(r,pick,onDelta){const rd=r.body.getReader(),dc=new TextDecoder();let buf='',out='';
 for(;;){const {done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});let i;
  while((i=buf.indexOf('\n'))>=0){const l=buf.slice(0,i).trim();buf=buf.slice(i+1);
   if(l.startsWith('data:')&&l.slice(5).trim()!=='[DONE]'){try{const d=pick(JSON.parse(l.slice(5)));if(d){out+=d;onDelta(out)}}catch(e){}}}}
 return out}
async function llm1(P,sys,msgs,onDelta,quiet){
 const g=P==='gemini',m=S.pm[P],stream=!!onDelta;lastM=m;
 if(!S.keys[P])throw new Error('API anahtarı yok: Ayarlar\'dan ekle.');
 const tools=g&&S.web&&!noG&&!quiet;let url,body;
 if(g){url='https://generativelanguage.googleapis.com/v1beta/models/'+m+(stream?':streamGenerateContent?alt=sse':':generateContent');
  body={systemInstruction:{parts:[{text:sys}]},contents:msgs.map(x=>({role:x.role==='assistant'?'model':'user',parts:[{text:x.content}]}))}}
 else{url='https://api.groq.com/openai/v1/chat/completions';body={model:m,stream,messages:[{role:'system',content:sys}].concat(msgs)}}
 const go=t=>{const b=Object.assign({},body);if(t)b.tools=[{google_search:{}}];
  return fetch(url,{method:'POST',headers:hdr(P),body:JSON.stringify(b),signal:stream?ctl.signal:undefined})};
 let r=await go(tools);
 if(!r.ok&&tools){if(r.status!==429)noG=1;r=await go(false)}
 if(!r.ok){let t=await r.text();try{t=JSON.parse(t).error.message}catch(e){}throw new Error(r.status+': '+t.slice(0,240))}
 if(!stream){const j=await r.json();return g?j.candidates[0].content.parts.map(p=>p.text||'').join(''):j.choices[0].message.content}
 return sse(r,g?j=>((j.candidates&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join(''):j=>j.choices[0].delta.content,onDelta)}

async function llm(sys,msgs,onDelta,quiet){const o=S.prov,alt=o==='gemini'?'groq':'gemini';
 const run=async(P,sy)=>{if(P==='groq'&&S.web&&!quiet&&P!==o){try{const w=await wiki(msgs[msgs.length-1].content);if(w.length)sy+='\n\nWeb (Vikipedi) sonuçları, gerçek bilgi için kullan, kaynağı an:\n'+w.map(x=>'['+x.t+'] '+x.x).join('\n---\n')}catch(e){}}return llm1(P,sy,msgs,onDelta,quiet)};
 if(!S.keys[o]&&S.keys[alt])return run(alt,sys);
 try{return await run(o,sys)}catch(e){if(e.name==='AbortError'||!S.keys[alt])throw e;return run(alt,sys)}}
const tok=s=>(s.toLowerCase().match(/[a-zçğıöşü0-9]{3,}/g)||[]);
function rag(q){const t=[...new Set(tok(q))],res=[];
 S.docs.forEach(d=>d.chunks.forEach(c=>{const l=c.toLowerCase();let sc=0;t.forEach(w=>{const n=l.split(w).length-1;if(n)sc+=1+Math.log(n)});if(sc>1)res.push({sc,c,n:d.name})}));
 return res.sort((a,b)=>b.sc-a.sc).slice(0,3)}

async function send(){
 if(busy){ctl&&ctl.abort();return}
 const inp=$('#in'),text=inp.value.trim();if(!text)return;
 if(!S.keys.gemini&&!S.keys.groq){panel('ayar');return}
 let ch=cur();if(!ch){ch={id:uid(),title:text.slice(0,32),msgs:[]};S.chats.unshift(ch);S.cur=ch.id}
 ch.msgs.push({r:'user',c:text});inp.value='';inp.style.height='auto';
 window.speechSynthesis&&speechSynthesis.cancel();const hits=rag(text);let web=[];
 if(S.web&&S.prov!=='gemini'){busy=1;render();try{web=await wiki(text)}catch(e){}}
 const sys=S.sys
  +(S.mem.length?'\n\nKullanıcı hakkında bildiklerin:\n'+S.mem.map(x=>'- '+x).join('\n'):'')
  +(S.rules.length?'\n\nKullanıcının geri bildirimlerinden öğrendiğin kurallar (mutlaka uy):\n'+S.rules.map(x=>'- '+x).join('\n'):'')
  +(hits.length?'\n\nKullanıcının bilgi tabanından ilgili parçalar (uygunsa kullan, dosya adını an):\n'+hits.map(h=>'['+h.n+'] '+h.c).join('\n---\n'):'')
  +(web.length?'\n\nWeb (Vikipedi) sonuçları, gerçek bilgi için kullan, kaynağı an:\n'+web.map(w=>'['+w.t+'] '+w.x).join('\n---\n'):'');
 const m=S.pm[S.prov];
 const msg={r:'assistant',c:'',m};ch.msgs.push(msg);busy=1;ctl=new AbortController();render();
 let h=ch.msgs.slice(-31,-1).filter(x=>x.c&&!x.c.startsWith('⚠️')).map(x=>({role:x.r,content:x.c}));
 while(h.length&&h[0].role!=='user')h.shift();
 try{msg.c=await llm(sys,h,t=>{msg.c=t;paintLast()});msg.m=lastM}
 catch(e){msg.c=(msg.c?msg.c+'\n\n':'')+'⚠️ '+(e.name==='AbortError'?'Durduruldu.':e.message)}
 busy=0;save();render();if(!msg.c.includes('⚠️')){say(msg.c);learn(text,msg.c)}}

async function learn(u,a){if(u.length<25||!/(ben|benim|bende|bana|kullan|seviyor|istiyor|çalış|yapıyor|adım|genelde|hedef|projem)/i.test(u))return;try{
 const o=await llm('Sadece JSON dizi döndür.',[{role:'user',content:'Aşağıdaki konuşmadan kullanıcı hakkında KALICI ve işe yarar bilgileri (isim, tercih, proje, alışkanlık, hedef) çıkar. Sadece JSON dizi döndür; en fazla 3 kısa Türkçe cümle, yoksa []. Zaten bilinenler: '+JSON.stringify(S.mem)+'\n\nKullanıcı: '+u+'\nAsistan: '+a.slice(0,600)}],null,1);
 JSON.parse(o.match(/\[[\s\S]*\]/)[0]).forEach(x=>{if(typeof x==='string'&&x.trim()&&!S.mem.includes(x))S.mem.push(x)});
 S.mem=S.mem.slice(-60);save()}catch(e){}}

function fb(i,v){const m=cur().msgs[i];m.f=m.f===v?0:v;
 if(m.f<0){const n=prompt('Ne yanlıştı ya da nasıl olmalıydı? (Kalıcı kural olarak kaydedilir)');if(n&&n.trim())S.rules.push(n.trim().slice(0,200))}
 save();render()}
function cp(i){navigator.clipboard&&navigator.clipboard.writeText(cur().msgs[i].c)}

function render(){
 $('#list').innerHTML=S.chats.map(c=>'<div class="ci '+(c.id===S.cur?'on':'')+'" onclick="S.cur=\''+c.id+'\';save();render();side(0)"><span>'+esc(c.title)+'</span><i onclick="event.stopPropagation();del(\''+c.id+'\')">✕</i></div>').join('');
 const ch=cur();
 $('#msgs').innerHTML=ch?ch.msgs.map((m,i)=>'<div class="m '+m.r+'"><div class="b">'+(md(m.c)||'…')+'</div>'+(m.r==='assistant'&&m.c&&!(busy&&i===ch.msgs.length-1)?'<div class="act"><span onclick="cp('+i+')">Kopyala</span><span class="'+(m.f>0?'on':'')+'" onclick="fb('+i+',1)">👍</span><span class="'+(m.f<0?'on':'')+'" onclick="fb('+i+',-1)">👎</span><small>'+esc((m.m||'').replace('claude-',''))+'</small></div>':'')+'</div>').join('')
  :'<div class="empty"><b>Merhaba'+'!</b>Soru sor, öneri iste ya da sadece sohbet edelim. Seni zamanla tanırım.</div>';
 $('#go').textContent=busy?'■':'➤';scroll()}
function paintLast(){const b=document.querySelectorAll('.m.assistant .b');if(b.length)b[b.length-1].innerHTML=md(cur().msgs.slice(-1)[0].c);scroll()}

function panel(t){tab=t||tab;const T=(k,n)=>'<button class="'+(tab===k?'on':'')+'" onclick="panel(\''+k+'\')">'+n+'</button>';
 let h='<div class="tabs">'+T('ayar','Ayarlar')+T('hafiza','Hafıza')+T('bilgi','Bilgi tabanı')+'<button class="btn" style="margin-left:auto" onclick="closeP()">Kapat</button></div>';
 if(tab==='ayar'){const sec=(p,t,u)=>'<label>'+t+' API anahtarı: '+u+'</label><input id="k_'+p+'" type="password" value="'+esc(S.keys[p])+'"><label>'+t+' modeli (listelemek için kutuyu temizleyip dokun)</label><div style="display:flex;gap:8px"><input id="m_'+p+'" list="l_'+p+'" value="'+esc(S.pm[p])+'"><datalist id="l_'+p+'"></datalist><button class="btn" onclick="models(\''+p+'\')">Listele</button></div>';
  h+='<label>Öncelikli sağlayıcı (o hata verirse, diğerinin anahtarı varsa otomatik devreye girer)</label><select id="pv"><option value="gemini"'+(S.prov==='gemini'?' selected':'')+'>Google Gemini (web aramalı)</option><option value="groq"'+(S.prov==='groq'?' selected':'')+'>Groq (çok hızlı)</option></select>'
  +sec('gemini','Gemini','aistudio.google.com/apikey')+sec('groq','Groq','console.groq.com/keys')
  +'<label>Asistanın karakteri (sistem promptu)</label><textarea id="sy">'+esc(S.sys)+'</textarea>'
  +'<p class="hint">Ücretsiz kotalar küçüktür. Anahtarlar yalnızca bu cihazda saklanır.</p><button class="btn pri" onclick="saveCfg()">Kaydet</button> <button class="btn" onclick="expo()">Yedek al</button> <button class="btn" onclick="impo2()">Yedek yükle</button><input id="imp" type="file" accept=".json" hidden onchange="impo(this)">'}
 if(tab==='hafiza')h+='<p class="hint">Sohbetlerden öğrendiklerim. Yanlış olanı silebilirsin; her cevapta kullanılır.</p>'
  +(S.mem.map((x,i)=>'<div class="row"><span>'+esc(x)+'</span><i onclick="S.mem.splice('+i+',1);save();panel()">✕</i></div>').join('')||'<p class="hint">Henüz bir şey öğrenmedim.</p>')
  +'<label>Elle bilgi ekle</label><input id="nm" placeholder="Örn: Android tablet kullanıyorum"><p></p><button class="btn pri" onclick="addMem()">Ekle</button>'
  +'<label>Geri bildirimden öğrendiğim kurallar (👎 ile oluşur)</label>'
  +(S.rules.map((x,i)=>'<div class="row"><span>'+esc(x)+'</span><i onclick="S.rules.splice('+i+',1);save();panel()">✕</i></div>').join('')||'<p class="hint">Henüz kural yok.</p>');
 if(tab==='bilgi')h+='<p class="hint">PDF, .txt, .md, .csv, .json veya .html dosyası yükle. Sorularında ilgili bölümleri bulup kullanırım. Taranmış (resim) PDF dosyalarında metin çıkmaz.</p>'
  +'<button class="btn pri" onclick="$(\'#fl\').click()">Dosya yükle</button><input id="fl" type="file" multiple accept=".pdf,application/pdf,.txt,.md,.csv,.json,.html,text/*" hidden onchange="upl(this)">'
  +S.docs.map((d,i)=>'<div class="row"><span>'+esc(d.name)+' <small>('+d.chunks.length+' parça)</small></span><i onclick="S.docs.splice('+i+',1);save();panel()">✕</i></div>').join('');
 $('#box').innerHTML=h;$('#modal').style.display='flex'}
function closeP(){$('#modal').style.display='none'}
function impo2(){$('#imp').click()}
function saveCfg(){S.prov=$('#pv').value;['gemini','groq'].forEach(p=>{S.keys[p]=$('#k_'+p).value.trim();S.pm[p]=$('#m_'+p).value.trim()||S.pm[p]});S.sys=$('#sy').value.trim()||DEF;noG=0;save();closeP()}
async function models(p){try{const k=$('#k_'+p).value.trim();let r,l;
 if(p==='gemini'){r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=100',{headers:{'x-goog-api-key':k}});l=(await r.json()).models.filter(x=>(x.supportedGenerationMethods||[]).includes('generateContent')).map(x=>x.name.replace('models/',''))}
 else{r=await fetch('https://api.groq.com/openai/v1/models',{headers:{authorization:'Bearer '+k}});l=(await r.json()).data.map(x=>x.id)}
 l=l.filter(x=>!/guard|whisper|tts|embed|image|imagen|veo|live|audio|aqa|computer|robotics|classif|moderation|orpheus|lyria|2\.5|pro/i.test(x));
 $('#l_'+p).innerHTML=l.map(x=>'<option value="'+x+'">').join('');$('#m_'+p).value='';$('#m_'+p).focus();alert(l.length+' model bulundu. Kutuya dokunup birini seç.')}catch(e){alert('Liste alınamadı: anahtarı kontrol et.')}}
function addMem(){const v=$('#nm').value.trim();if(v){S.mem.push(v);save();panel()}}
async function pdfText(f){if(!window.pdfjsLib){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';s.onload=ok;s.onerror=()=>no(new Error('pdf.js yüklenemedi (internet var mı?)'));document.head.appendChild(s)});pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
 const p=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let t='';for(let i=1;i<=p.numPages&&t.length<3e5;i++){const c=await(await p.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n'}return t}
async function upl(el){for(const f of el.files){try{if(f.size>2e7)throw new Error('çok büyük');
 let t=/\.pdf$/i.test(f.name)?await pdfText(f):await f.text();t=t.replace(/[ \t]+/g,' ').replace(/\s*\n\s*/g,'\n').slice(0,3e5);
 if(t.trim().length<20)throw new Error('metin çıkmadı');
 const ch=[];for(let i=0;i<t.length;i+=700)ch.push(t.slice(Math.max(0,i-100),i+800));S.docs.push({id:uid(),name:f.name,chunks:ch});save();panel()}catch(e){alert(f.name+': '+e.message)}}}
async function wiki(q){const out=[];for(const L of['tr','en']){const r=await fetch('https://'+L+'.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q.slice(0,120))+'&gsrlimit=3&prop=extracts&exintro=1&explaintext=1&exchars=700&format=json&origin=*');const j=await r.json();Object.values((j.query||{}).pages||{}).forEach(p=>p.extract&&out.push({t:L+'.wikipedia: '+p.title,x:p.extract}));if(out.length)break}return out}
function tgl(k){S[k]=!S[k];if(k==='speak'&&!S.speak&&window.speechSynthesis)speechSynthesis.cancel();save();tg()}
function tg(){$('#wbtn').classList.toggle('on',S.web);$('#sbtn').classList.toggle('on',S.speak)}
function say(t){if(!S.speak||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g,' kod bloğu ').replace(/[*`#]/g,''));u.lang='tr-TR';speechSynthesis.speak(u)}
function mic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Bu tarayıcı sesle yazmayı desteklemiyor (Chrome kullan).');
 if(rec){rec.stop();return}
 window.speechSynthesis&&speechSynthesis.cancel();rec=new SR();rec.lang='tr-TR';rec.interimResults=true;let fin='';$('#mic').classList.add('on');
 rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;fin=t;$('#in').value=t};
 rec.onerror=e=>{if(e.error!=='no-speech'&&e.error!=='aborted'){$('#in').focus();alert('Mikrofon hatası ('+e.error+'). Klavyendeki mikrofon tuşuyla da konuşabilirsin; uygulama mikrofonu için dosyayı https adresinden aç.')}};
 rec.onend=()=>{rec=null;$('#mic').classList.remove('on');if(fin.trim())send()};
 rec.start()}
function expo(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='asistan-yedek.json';a.click()}
function impo(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=Object.assign(S,JSON.parse(r.result));save();render();panel()}catch(e){alert('Geçersiz yedek dosyası')}};r.readAsText(f)}
$('#in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,180)+'px'});
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}});
render();tg();if(!S.keys.gemini&&!S.keys.groq)panel('ayar');
